<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Игра с гоблинами</title>
  </head>
  <body>
    <div class="container">
      <h1>Игра с гоблинами</h1>
      <div class="game-info">
        <span>Счёт: <b class="score-value">0</b></span>
        <span>Пропущено: <b class="missed-value">0</b> / 5</span>
      </div>
      <div class="game-field" id="game-field"></div>
      <div class="game-over hidden" id="game-over">
        <h2>Игра окончена!</h2>
        <p>Ваш счёт: <b class="final-score">0</b></p>
      </div>
      <button class="restart-btn hidden" id="restart-btn">Играть снова</button>
    </div>
  </body>
</html>
